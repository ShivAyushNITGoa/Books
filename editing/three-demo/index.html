import * as THREE from '/editing/three-demo/node_modules/three/build/three.module.js';
const W=1280,H=720;
const renderer=new THREE.WebGLRenderer({antialias:false,preserveDrawingBuffer:true,alpha:false,depth:false,stencil:false});
renderer.setSize(W,H);renderer.setPixelRatio(1);renderer.outputColorSpace=THREE.SRGBColorSpace;

const params=new URLSearchParams(location.search);

const loader=new THREE.TextureLoader();
const textures=await Promise.all(labels.map(l=>loader.loadAsync('/images_tv12/'+l+'.jpg')));
textures.forEach(t=>{t.colorSpace=THREE.SRGBColorSpace;t.minFilter=THREE.LinearFilter;});
const camera=new THREE.PerspectiveCamera(42,16/9,.1,100);
const scenes=textures.map((texture,i)=>{
 const scene=new THREE.Scene();scene.background=new THREE.Color('#10131a');
 const geo=new THREE.PlaneGeometry(16.7,9.4,24,14);
 const pos=geo.attributes.position;
 // Heuristic bas-relief: center/lower-frame proximity, not recovered geometry.
 for(let k=0;k<pos.count;k++){
  const x=pos.getX(k),y=pos.getY(k);
  const depth=Math.exp(-((x/5.5)**2+((y+.7)/4.6)**2)*1.4);
  pos.setZ(k,depth*.42);
 }
 geo.computeVertexNormals();
 const material=new THREE.MeshBasicMaterial({map:texture});
 scene.add(new THREE.Mesh(geo,material));
 // Sparse deterministic foreground motes supply an independent depth plane.
 const points=new Float32Array(55*3);
 for(let j=0;j<55;j++){points[j*3]=Math.sin(j*127.1+i)*8;points[j*3+1]=Math.sin(j*43.7)*4.7;points[j*3+2]=1+(j%7)*.32;}
 const pg=new THREE.BufferGeometry();pg.setAttribute('position',new THREE.BufferAttribute(points,3));
 const pm=new THREE.PointsMaterial({color:0xe8d8ba,size:.016,transparent:true,opacity:.16,depthWrite:false});
 const dust=new THREE.Points(pg,pm);scene.add(dust);
 return {scene,dust};
});
const targets=[0,1].map(()=>new THREE.WebGLRenderTarget(W,H));
const mixScene=new THREE.Scene(),mixCamera=new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const mixMat=new THREE.ShaderMaterial({
 uniforms:{a:{value:targets[0].texture},b:{value:targets[1].texture},blend:{value:0},mode:{value:0},focusA:{value:new THREE.Vector2(.5,.5)},focusB:{value:new THREE.Vector2(.5,.5)},blurA:{value:0},blurB:{value:0}},
 vertexShader:`varying vec2 v;void main(){v=uv;gl_Position=vec4(position.xy,0.,1.);}`,
 fragmentShader:`
 uniform sampler2D a,b;
 uniform float blend,mode,blurA,blurB;
 uniform vec2 focusA,focusB;
 varying vec2 v;
 const float PI=3.14159265;
 vec4 focused(sampler2D tex,vec2 uv,vec2 center,float amount){
   float r=smoothstep(.15,.65,length((uv-center)*vec2(1.0,.5625)));
   vec2 d=vec2(1./1280.,1./720.)*(r*1.6+amount);
   vec4 c=texture2D(tex,clamp(uv,.001,.999))*.4;
   c+=texture2D(tex,clamp(uv+d,.001,.999))*.15;
   c+=texture2D(tex,clamp(uv-d,.001,.999))*.15;
   c+=texture2D(tex,clamp(uv+vec2(d.x,-d.y),.001,.999))*.15;
   c+=texture2D(tex,clamp(uv+vec2(-d.x,d.y),.001,.999))*.15;
   return c;
 }
 vec2 rot(vec2 p,float ang){float c=cos(ang),s=sin(ang);return vec2(p.x*c-p.y*s,p.x*s+p.y*c);}
 void main(){

   vec2 ua=v,ub=v;
   float weight=blend;
   float m=mode;
   if(m>.5&&m<1.5){ // feathered horizontal reveal, left to right
     weight=1.-smoothstep(blend*1.6-.52,blend*1.6-.08,v.x);
   }else if(m>1.5&&m<2.5){ // restrained optical zoom blend
     ua=(v-.5)*(1.-pulse*.035)+.5;
     ub=(v-.5)*(1.+pulse*.025)+.5;
   }else if(m>3.5&&m<4.5){ // feathered vertical reveal, top to bottom
     weight=1.-smoothstep(blend*1.6-.52,blend*1.6-.08,1.-v.y);
   }else if(m>4.5&&m<5.5){ // diagonal feathered wipe
     float d=(v.x+(1.-v.y))*.5;
     weight=1.-smoothstep(blend*1.6-.52,blend*1.6-.08,d);
   }else if(m>5.5&&m<6.5){ // soft radial iris dissolve
     float r=length((v-.5)*vec2(1.,.5625));
     float edge=mix(.85,-.2,blend);
     weight=smoothstep(edge-.16,edge+.16,r);
   }else if(m>7.5&&m<8.5){ // converging directional smear cross
     ua.x-=pulse*.014;ub.x+=pulse*.014;
   }else if(m>9.5){ // counter-roll cross with compensating breath zoom
     float k=1.-pulse*.05;
     ua=rot((v-.5)*k,pulse*.02)+.5;
     ub=rot((v-.5)*k,-pulse*.02)+.5;
   }
   // Quintic blend arrives pre-eased; clamp keeps every mode seamless at both ends.
   if(blend<.001)weight=0.;
   if(blend>.999)weight=1.;
   float defocus=(m>2.5&&m<3.5)?pulse*3.:0.;
   vec4 c=mix(focused(a,ua,focusA,blurA+defocus),focused(b,ub,focusB,blurB+defocus),weight);
   if(m>6.5&&m<7.5)c.rgb+=vec3(1.,.8,.55)*.18*pulse*pulse; // warm glow dissolve
   if(m>8.5&&m<9.5){ // chromatic soft split that resolves to zero

     c.b=mix(focused(a,ua-off,focusA,blurA+defocus).b,focused(b,ub-off,focusB,blurB+defocus).b,weight);
   }
   float vig=1.-.10*pow(length((v-.5)*1.2),2.);
   gl_FragColor=vec4(c.rgb*vig,1.);
   #include <tonemapping_fragment>
   #include <colorspace_fragment>

});
mixScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2),mixMat));
// Per-shot camera vocabulary and approximate screen-space focus targets.
const shots=[
 {style:'focus push-in',focus:[.52,.52]},
 {style:'left-to-right track',focus:[.56,.52]},
 {style:'pull-out reveal',focus:[.48,.48]},
 {style:'right-to-left track',focus:[.52,.48]},
 {style:'rising pedestal',focus:[.5,.58]},
 {style:'diagonal dolly',focus:[.52,.52]},
 {style:'shallow orbit',focus:[.5,.52]},
 {style:'focus pull-out',focus:[.50,.52]},
 {style:'arc sweep',focus:[.54,.52]},
 {style:'crane down',focus:[.5,.46]},
 {style:'lateral sway push',focus:[.5,.52]},
 {style:'dutch settle push',focus:[.5,.5]},
 {style:'rise and open',focus:[.5,.55]},
 {style:'settle drift',focus:[.52,.5]},
 {style:'counter orbit',focus:[.48,.52]},
 {style:'gentle closing push',focus:[.5,.5]}
];
window.shotStyles=shots;
function drawScene(i,t,target){
 const duration=durs[i];
 const pin=hws[i]||.3,pout=hws[i+1]?? .3;
 const u=THREE.MathUtils.clamp((t-starts[i]+pin)/(duration+pin+pout),0,1);
 const e=u*u*u*(u*(u*6.-15.)+10.); // quintic easing: zero end velocity/acceleration
 // Speed and travel scale with this image's own duration: short cues stay
 // brisk and light, long holds get wider, more languid moves.
 const amp=THREE.MathUtils.clamp(.7+.08*duration,.7,1.4);
 const sway=Math.sin(Math.PI*e);
 let x=0,y=0,z=11.6,tx=0,ty=0,roll=0;
 switch((source[i].cue-1)%16){
  case 0:z=12.-1.35*amp*e;tx=.12*e;break;
  case 1:x=(-.65+1.3*e)*amp;z=11.25;tx=x*.35;break;
  case 2:z=10.8+1.2*amp*e;break;
  case 3:x=(.65-1.3*e)*amp;z=11.25;tx=x*.35;break;
  case 4:y=(-.30+.60*e)*amp;z=11.7-.4*amp*e;ty=y*.3;break;
  case 5:x=(-.45+.9*e)*amp;y=(-.2+.4*e)*amp;z=11.8-.9*amp*e;tx=x*.3;ty=y*.3;break;
  case 6:x=.62*amp*Math.sin((e-.5)*1.6);y=.12*amp*sway;z=11.4-.35*amp*sway;break;
  case 7:z=10.8+1.05*amp*e;x=(.2-.4*e)*amp;break;
  case 8:x=(-.7+1.4*e)*amp;y=.18*amp*sway;z=11.5-.5*amp*sway;tx=x*.4;break;
  case 9:y=(.42-.70*e)*amp;z=11.5+.25*amp*e;ty=y*.25;break;
  case 10:z=11.9-1.1*amp*e;x=.35*amp*sway;tx=-.1*e;break;
  case 11:z=11.7-.7*amp*e;roll=.022*amp*(2*e-1);break;
  case 12:y=(-.25+.5*e)*amp;z=11.0+1.0*amp*e;ty=y*.3;break;
  case 13:{const e2=e*e*(3-2*e);z=12.0-1.4*amp*e2;x=.25*amp*(2*e2-1);break;}
  case 14:x=-.55*amp*Math.sin((e-.5)*1.6);y=-.1*amp*sway;z=11.5-.3*amp*sway;break;
  default:z=11.7-.55*amp*e;
 }
 camera.position.set(x,y,z);camera.lookAt(tx,ty,.16);
 if(roll)camera.rotateZ(roll);
 scenes[i].dust.position.x=.04*(t-starts[i]);scenes[i].dust.position.y=.018*(t-starts[i]);
 renderer.setRenderTarget(target);renderer.render(scenes[i].scene,camera);
 const s=(source[i].cue-1)%16;
 let blur=0;
 if(s===0)blur=(1-e)*1.3;
 else if(s===7)blur=e*.8;
 else if(s===2)blur=e*.5;
 else if(s===10)blur=(1-e)*.9;
 else if(s===12)blur=e*.45;
 else if(s===13)blur=(1-e)*.7;

}
window.renderAt=t=>{
 t=Math.min(total-.001,Math.max(starts[0],t));
 let i=starts.findLastIndex(s=>s<=t);
 let j=-1;
 for(let k=1;k<starts.length;k++){if(Math.abs(t-starts[k])<hws[k]){j=k;break;}}
 let a=i,b=i,blend=0;
 if(j>0){a=j-1;b=j;let u=THREE.MathUtils.clamp((t-starts[j]+hws[j])/(2*hws[j]),0,1);blend=u*u*u*(u*(u*6-15)+10);}

 // No second scene render/copy outside the short transition windows.
 const fb=a===b?fa:drawScene(b,t,targets[1]);

 uniforms.b.value=a===b?targets[0].texture:targets[1].texture;
 uniforms.blend.value=blend;
 // Eleven smooth transition modes cycle deterministically across boundaries.
 uniforms.mode.value=j>0?((source[j].cue*7+j)%11):0;
 uniforms.focusA.value.set(...fa.focus);uniforms.focusB.value.set(...fb.focus);
 uniforms.blurA.value=fa.blur;uniforms.blurB.value=fb.blur;

};

</script></body></html>
