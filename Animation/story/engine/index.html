<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Story World Studio</title><style>@font-face{font-family:Story;src:url('../../engine/fonts/Inter.ttf')}*{box-sizing:border-box}body{margin:0;background:#101a29;color:#fff;font:14px system-ui;display:grid;place-items:center;min-height:100vh}main{display:grid;justify-items:center;gap:10px;padding:12px}canvas{max-width:94vw;max-height:85vh;width:auto;height:auto;box-shadow:0 20px 80px #0008}nav{display:flex;align-items:center;gap:12px;width:100%}input{flex:1;min-width:60px}button{background:#ffcf70;border:0;border-radius:6px;padding:9px 18px;cursor:pointer}#error{max-width:700px;color:#ffbca3;white-space:pre-wrap}</style><main><canvas></canvas><nav><button id="play">Play</button><input id="seek" aria-label="Timeline" type="range" min="0" max="1" step=".01" value="0"><output id="clock">0:00</output></nav><div id="error" role="alert"></div></main><script type="module" src="world.js"></script></html>
