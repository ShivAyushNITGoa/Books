<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Animation • Script-driven Studio</title><style>*{box-sizing:border-box}body{margin:0;background:#192c30;color:#faf4e8;font:14px system-ui;display:grid;place-items:center;min-height:100vh}main{width:min(100%,560px)}h1{font-size:17px;padding:0 12px}canvas{display:block;width:100%;background:#f3e8d6}nav{display:flex;gap:12px;padding:12px;align-items:center}button,a{color:inherit;background:#31494a;border:0;border-radius:8px;padding:10px;text-decoration:none}input{min-width:0;flex:1}#status{padding:0 12px 12px;color:#d5c8ac}#error{white-space:pre-wrap;padding:16px;color:#ffbfa8}</style></head><body><main><h1 id="title">Loading project…</h1><canvas width="1080" height="1920" aria-label="Animated cutout characters in a continuous classroom"></canvas><nav><button id="play">▶ Play</button><input aria-label="Seek animation" id="seek" type="range" min="0" max="30" step="0.01" value="0"><span id="time">0:00</span></nav><div id="status"></div><div id="error" role="alert"></div></main><script type="module">import('./world.js').catch(e=>{window.renderError=e.message;document.querySelector('#error').textContent=e.stack||e.message;document.querySelector('#play').disabled=true;console.error(e)})</script></body></html>
