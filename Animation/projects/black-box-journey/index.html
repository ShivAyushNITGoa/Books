<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="A continuous illustrated journey from an engineering factory through mixed woodland, across the coast, down to the seabed and back to a regional airport.">
  <title>The black box — one connected geographic journey</title>
  <style>
    @font-face {
      font-family: Caption;
      src: url('../alexandria/assets/Caption-Heavy.ttf');
      font-display: block;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #102a34;
      color: #ecedd8;
      font: 14px system-ui, sans-serif;
      display: grid;
      place-items: center;
      min-height: 100vh;
    }
    main { width: min(100%, 430px); }
    canvas { display: block; width: 100%; height: auto; }
    nav {
      display: flex;
      gap: 9px;
      align-items: center;
      padding: 12px;
      background: #21434e;
    }
    button {
      background: #365d67;
      color: white;
      border: 1px solid #74989c;
      padding: 8px;
      border-radius: 6px;
      cursor: pointer;
    }
    button:focus-visible, input:focus-visible { outline: 3px solid #ffb36c; }
    input { flex: 1; min-width: 40px; accent-color: #eb9150; }
    small { display: block; padding: 10px; color: #b5cbc3; line-height: 1.5; }
  </style>
</head>
<body>
  <main>
    <canvas id="film" aria-label="Continuous geographic journey through factory, mixed forest, estuary, open ocean, recovery harbour and airport"></canvas>
    <nav aria-label="Film playback controls">
      <button id="play" type="button">Play</button>
      <input id="seek" aria-label="Film timeline" type="range" min="0" max="65.0416667" step="0.01" value="0">
      <button id="cc" type="button" aria-label="Toggle English captions">CC</button>
      <span id="clock">0:00</span>
    </nav>
    <small>One landscape · One continuous camera · Original English narration<br>Geographic travel is time-compressed to preserve the supplied script.</small>
    <audio id="vo" src="../black-box/delivery/voiceover.flac" preload="auto"></audio>
  </main>
  <script type="module" src="film.js"></script>
</body>
</html>
